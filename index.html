<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7fb" />
    <title>登录 · 学习之旅</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="intro" aria-label="欢迎信息">
        <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> 学习之旅</div>
        <div class="intro-copy">
          <p class="eyebrow">WELCOME BACK</p>
          <h1>每一次学习，<br />都从这里继续。</h1>
          <p>输入账号和密码，开启今天的探索。</p>
        </div>
        <div class="intro-footer">保持好奇，持续向前。</div>
      </section>

      <section class="login-panel" aria-labelledby="login-title">
        <div class="card">
          <p class="card-kicker">账号登录</p>
          <h2 id="login-title">欢迎回来</h2>
          <p class="card-description">请填写你的账号信息</p>

          <form id="login-form" novalidate>
            <div class="field">
              <label for="username">账号</label>
              <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入账号" required aria-describedby="username-error" />
              <p class="field-error" id="username-error" aria-live="polite"></p>
            </div>

            <div class="field">
              <label for="password">密码</label>
              <div class="password-control">
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required aria-describedby="password-error" />
                <button id="toggle-password" class="toggle-password" type="button" aria-label="显示密码" aria-pressed="false">显示</button>
              </div>
              <p class="field-error" id="password-error" aria-live="polite"></p>
            </div>

            <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
            <button class="submit-button" type="submit">登录 <span aria-hidden="true">→</span></button>
          </form>

          <div class="demo-tip">
            <span class="tip-icon" aria-hidden="true">i</span>
            <p>体验账号 <strong>demo</strong>　密码 <strong>123456</strong><br /><small>仅在本页面校验，无需连接服务器</small></p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
