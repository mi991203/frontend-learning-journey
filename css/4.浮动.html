<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        header {
            width: 1000px;
            height: 100px;
            background-color: gray;
            margin: 0 auto;
        }
        header .logo {
            float: left;
            width: 220px;
            height: 100px;
            background-color: orange;
        }
        header .login {
            float: right;
            width: 220px;
            height: 30px;
            background-color: orange;
        }
        nav {
            float: right;
            width: 690px;
            height: 60px;
            background-color: green;
            margin: 10px 0 0 0;
        }
        .content {
            display: block;
            width: 1000px;
            height: 500px;
            margin: 20px auto;
        }
        .content .ad {
            float: left;
            width: 300px;
            height: 500px;
            background-color: orange;
        }
        .content main {
            float: right;
            width: 680px;
            height: 500px;
        }
        .content main .banner {
            width: 680px;
            height: 200px;
            background-color: yellow;
        }
        .content main .pics {
            width: 680px;
            height: 250px;  
            background-color: blue;
            margin-top: 50px;
        }

        footer {
            width: 1000px;
            height: 200px;
            background-color: gray;
            margin: 40px auto;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo"></div>
        <div class="login"></div>
        <nav></nav>
    </header>
    <content class="content">
        <aside class="ad"></aside>
        <main>
            <div class="banner"></div>
            <div class="pics"></div>
        </main>
    </content>
    <footer></footer>
</body>
</html>
